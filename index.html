<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=1.0">
    <title>嘉儀企業嘉年會 BINGO</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --box-bg: #16213e;
            --btn-idle: #2d3561;
            --text-color: #ecf0f1;
            --color-B: #e74c3c;
            --color-I: #3498db;
            --color-N: #2ecc71;
            --color-G: #f39c12;
            --color-O: #9b59b6;
            --color-gold: #f1c40f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            box-sizing: border-box;
        }

        .event-title {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: var(--color-gold);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            flex-shrink: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 0 10px;
            flex-shrink: 0;
        }

        .group-box {
            background-color: var(--box-bg);
            border: 2px solid #444;
            border-radius: 8px;
            text-align: center;
        }

        .group-header {
            font-size: 26px;
            font-weight: bold;
            padding: 4px 0;
            color: white;
        }

        .group-numbers {
            font-size: 18px;
            padding: 5px;
            font-weight: bold;
            min-height: 40px;
        }

        .main-display-area {
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 10px;
            flex-grow: 1;
            align-items: stretch;
            min-height: 0;
        }

        /* 歷史紀錄區 (2/3) */
        .history-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .history-display {
            background-color: #0f172a;
            border: 2px solid #2d3561;
            border-radius: 12px;
            padding: 20px;
            font-family: 'Consolas', monospace;
            font-size: 36px;
            font-weight: 900;
            flex-grow: 1;
            overflow-y: auto;
            line-height: 1.8;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* 重點修正：確保英文字母與數字不被切斷 */
        .history-display span {
            white-space: nowrap;
            display: inline-block; /* 確保整體換行 */
        }

        .arrow-sep {
            color: #334155;
            margin: 0 8px;
            font-size: 28px;
            display: inline-block;
            white-space: normal; /* 箭頭後可以換行 */
        }

        .latest-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .latest-number-box {
            background: radial-gradient(circle, #1e293b 0%, #020617 100%);
            border: 8px solid var(--color-gold);
            border-radius: 30px;
            width: 100%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(80px, 14vw, 160px); 
            font-weight: 900;
            color: #ffffff !important;
            transition: all 0.3s ease;
            text-shadow: 0 0 40px rgba(255,255,255,0.6);
        }

        @keyframes glow-pulse {
            0% { box-shadow: 0 0 20px rgba(255,255,255,0.1); }
            50% { box-shadow: 0 0 60px var(--glow-color); }
            100% { box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        }
        .glowing { animation: glow-pulse 2s infinite ease-in-out; }

        .nav-bar { text-align: center; padding: 5px 0; flex-shrink: 0; }
        button.ctrl-btn { cursor: pointer; border: none; border-radius: 6px; padding: 8px 18px; font-size: 16px; font-weight: bold; margin: 0 4px; }
        .btn-nav { background-color: #34495e; color: white; }
        .btn-new { background-color: #27ae60; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(25, 1fr); 
            gap: 2px;
            padding: 5px;
            flex-shrink: 0;
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(0,0,0,0.2);
        }

        .num-btn {
            background-color: var(--btn-idle);
            color: var(--text-color);
            aspect-ratio: 1.1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 900;
            border-radius: 2px;
            border: 1px solid #333;
            cursor: pointer;
        }

        .num-btn.active { border: 1px solid #fff; box-shadow: inset 0 0 10px rgba(255,255,255,0.2); }

        .B-fg { color: var(--color-B); } .I-fg { color: var(--color-I); } .N-fg { color: var(--color-N); } .G-fg { color: var(--color-G); } .O-fg { color: var(--color-O); }
        .B-bg { background-color: var(--color-B); } .I-bg { background-color: var(--color-I); } .N-bg { background-color: var(--color-N); } .G-bg { background-color: var(--color-G); } .O-bg { background-color: var(--color-O); }
    </style>
</head>
<body>

    <div class="event-title">嘉儀企業嘉年會 BINGO</div>

    <div class="board">
        <div class="group-box"><div class="group-header B-bg">B</div><div id="board-B" class="group-numbers"></div></div>
        <div class="group-box"><div class="group-header I-bg">I</div><div id="board-I" class="group-numbers"></div></div>
        <div class="group-box"><div class="group-header N-bg">N</div><div id="board-N" class="group-numbers"></div></div>
        <div class="group-box"><div class="group-header G-bg">G</div><div id="board-G" class="group-numbers"></div></div>
        <div class="group-box"><div class="group-header O-bg">O</div><div id="board-O" class="group-numbers"></div></div>
    </div>

    <div class="main-display-area">
        <div class="history-section">
            <div id="round-label" style="font-size:18px; font-weight:bold; color:#2ecc71; margin-bottom:5px;">第 1 輪 (進行中)</div>
            <div id="history-display" class="history-display">READY...</div>
        </div>

        <div class="latest-section">
            <div id="latest-box" class="latest-number-box">--</div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="ctrl-btn btn-nav" onclick="changeRound(-1)">◀ 前一輪</button>
        <button class="ctrl-btn btn-new" onclick="newGame()">🎮 結束本輪 / 下一場</button>
        <button class="ctrl-btn btn-reset" onclick="resetCurrent()">清空這局</button>
        <button class="ctrl-btn btn-nav" onclick="changeRound(1)">後一輪 ▶</button>
    </div>

    <div class="numbers-grid" id="numbers-grid"></div>

    <script>
        const groups = { 'B': [1,15], 'I': [16,30], 'N': [31,45], 'G': [46,60], 'O': [61,75] };
        let drawnNumbers = [];
        let gameHistory = [];
        let currentViewIndex = -1;

        function getLetter(n) {
            if (n <= 15) return 'B'; if (n <= 30) return 'I'; if (n <= 45) return 'N'; if (n <= 60) return 'G'; return 'O';
        }

        const grid = document.getElementById('numbers-grid');
        for (let i = 1; i <= 75; i++) {
            const btn = document.createElement('div');
            btn.className = 'num-btn'; btn.id = `btn-${i}`; btn.innerText = i;
            btn.onclick = () => toggleNumber(i);
            grid.appendChild(btn);
        }

        function toggleNumber(n) {
            if (currentViewIndex !== -1) return;
            const idx = drawnNumbers.indexOf(n);
            if (idx > -1) {
                const letter = getLetter(n);
                if (confirm(`確定要取消選取號碼 ${letter}${n} 嗎？`)) {
                    drawnNumbers.splice(idx, 1);
                } else {
                    return;
                }
            } else {
                drawnNumbers.push(n);
            }
            updateUI();
        }

        function updateUI() {
            const data = currentViewIndex === -1 ? drawnNumbers : gameHistory[currentViewIndex];
            ['B', 'I', 'N', 'G', 'O'].forEach(L => {
                const nums = data.filter(n => getLetter(n) === L).sort((a,b) => a-b);
                document.getElementById(`board-${L}`).innerText = nums.join(', ');
            });
            const historyEl = document.getElementById('history-display');
            if (data.length === 0) historyEl.innerHTML = "<span style='color:#444'>WAITING...</span>";
            else historyEl.innerHTML = data.map(n => `<span class="${getLetter(n)}-fg">${getLetter(n)}${n}</span>`).join('<span class="arrow-sep">→</span>');
            historyEl.scrollTop = historyEl.scrollHeight;

            const latestBox = document.getElementById('latest-box');
            if (data.length === 0) {
                latestBox.innerText = "--"; latestBox.style.color = "#444";
                latestBox.style.borderColor = "#444"; latestBox.classList.remove('glowing');
            } else {
                const lastNum = data[data.length - 1];
                const L = getLetter(lastNum);
                latestBox.innerText = L + lastNum;
                latestBox.style.color = "#ffffff"; 
                latestBox.style.borderColor = `var(--color-${L})`;
                latestBox.style.setProperty('--glow-color', `var(--color-${L})`);
                latestBox.classList.add('glowing');
            }
            const label = document.getElementById('round-label');
            label.innerText = currentViewIndex === -1 ? `第 ${gameHistory.length + 1} 輪 (進行中)` : `第 ${currentViewIndex + 1} 輪 (紀錄)`;
            label.style.color = currentViewIndex === -1 ? "#2ecc71" : "#e74c3c";
            for (let i = 1; i <= 75; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.className = data.includes(i) ? `num-btn active ${getLetter(i)}-bg` : `num-btn`;
            }
        }

        function newGame() {
            if (drawnNumbers.length === 0) return;
            if (confirm("結束本輪並保存紀錄？")) {
                gameHistory.push([...drawnNumbers]);
                drawnNumbers = []; currentViewIndex = -1; updateUI();
            }
        }
        function resetCurrent() {
            if (currentViewIndex === -1 && drawnNumbers.length > 0) {
                if (confirm("確定重置目前這輪？")) { drawnNumbers = []; updateUI(); }
            }
        }
        function changeRound(dir) {
            if (gameHistory.length === 0) return;
            if (currentViewIndex === -1) { if (dir === -1) currentViewIndex = gameHistory.length - 1; }
            else { currentViewIndex += dir; if (currentViewIndex >= gameHistory.length) currentViewIndex = -1; else if (currentViewIndex < 0) currentViewIndex = 0; }
            updateUI();
        }
        updateUI();
    </script>
</body>
</html>
